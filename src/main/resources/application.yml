micronaut:
  application:
    name: lillia

  security:
    authentication: bearer
    reject-not-found: false
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_GENERATOR_SIGNATURE_SECRET:a-string-secret-at-least-256-bits-long}
        #        claims-validators:
        #          issuer: lillia-api
        #          audience: lillia-app
        generator:
          access-token:
            expiration: 86400
          refresh-token:
            secret: ${JWT_GENERATOR_SIGNATURE_SECRET:a-string-secret-at-least-256-bits-long}

    endpoints:
      login:
        path: /signin
        unsupported-post-content-type-status: 415
      logout:
        path: /signout
        unsupported-post-content-type-status: 415
      oauth:
        path: /renew
        unsupported-post-content-type-status: 415

    intercept-url-map:
      - access: isAnonymous()
        pattern: /swagger/**
      - access: isAnonymous()
        pattern: /swagger-ui/**

  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

  serde:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    property-naming-strategy: CAMEL_CASE
    deserialization:
      ignore-unknown: true
    serialization:
      inclusion: ALWAYS
      #      inclusion: NON_ABSENT
      always-serialize-errors-as-list: true

  data:
    pageable:
      default-page-size: 24
      max-page-size: 240
      sort-parameter-name: sort
      size-parameter-name: size
      page-parameter-name: page

datasources:
  default:
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    #    url: jdbc:postgresql://localhost:5432/lillia_mn_kt
    #    username: postgres
    #    password: postgres

r2dbc:
  datasources:
    default:
      dialect: POSTGRES
      db-type: postgres
      #      url: r2dbc:postgresql://localhost:5432/lillia_mn_java
      #      username: postgres
      #      password: postgres
      options:
        protocol: postgres
        driver: pool

flyway:
  datasources:
    default:
      enabled: true
