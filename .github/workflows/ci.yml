name: ci

on:
  push:
    branches-ignore: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: set graalvm up
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 21
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: test with gradle
        run: ./gradlew test

  build:
    name: build app
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: set up docker
        uses: docker/setup-buildx-action@v3

      - name: build with docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
